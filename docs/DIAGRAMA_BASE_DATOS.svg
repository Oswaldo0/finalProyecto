<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .group-title { font: 700 16px Arial, sans-serif; fill: #334155; letter-spacing: .4px; }
      .table { stroke: #334155; stroke-width: 1.5; rx: 12; ry: 12; }
      .base { fill: #e0f2fe; }
      .security { fill: #ede9fe; }
      .document { fill: #dcfce7; }
      .detail { fill: #fef3c7; }
      .report { fill: #ffe4e6; }
      .catalog { fill: #e2e8f0; }
      .table-name { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .field { font: 400 12px Arial, sans-serif; fill: #334155; }
      .pk { font: 700 12px Arial, sans-serif; fill: #0f172a; }
      .fk { font: 700 12px Arial, sans-serif; fill: #b91c1c; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrowDash); }
      .note { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 11px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1320" />
  <text class="title" x="60" y="58">Diagrama de base de datos - Sistema Académico USO</text>
  <text class="subtitle" x="60" y="88">Relaciones principales según llaves foráneas y tablas de resumen de informes.</text>

  <text class="group-title" x="70" y="130">CATÁLOGOS Y ESTRUCTURA ACADÉMICA</text>
  <text class="group-title" x="640" y="130">SEGURIDAD Y AUDITORÍA</text>
  <text class="group-title" x="70" y="455">DOCUMENTOS ACADÉMICOS</text>
  <text class="group-title" x="1040" y="455">DETALLES DE DOCUMENTOS</text>
  <text class="group-title" x="640" y="1015">REPORTES</text>

  <!-- Base académica -->
  <g id="facultades">
    <rect class="table base" x="70" y="150" width="230" height="105" />
    <text class="table-name" x="88" y="177">facultades</text>
    <text class="pk" x="88" y="200">PK id</text>
    <text class="field" x="88" y="220">nombre, codigo</text>
    <text class="field" x="88" y="240">estado</text>
  </g>

  <g id="carreras">
    <rect class="table base" x="360" y="150" width="245" height="120" />
    <text class="table-name" x="378" y="177">carreras</text>
    <text class="pk" x="378" y="200">PK id</text>
    <text class="fk" x="378" y="220">FK facultad_id</text>
    <text class="field" x="378" y="240">nombre, codigo, estado</text>
  </g>

  <g id="planes">
    <rect class="table base" x="70" y="295" width="230" height="115" />
    <text class="table-name" x="88" y="322">planes_estudio</text>
    <text class="pk" x="88" y="345">PK id</text>
    <text class="fk" x="88" y="365">FK carrera_id</text>
    <text class="field" x="88" y="385">nombre, anio, estado</text>
  </g>

  <g id="estudiantes">
    <rect class="table base" x="360" y="300" width="245" height="125" />
    <text class="table-name" x="378" y="327">estudiantes</text>
    <text class="pk" x="378" y="350">PK id</text>
    <text class="fk" x="378" y="370">FK carrera_actual_id</text>
    <text class="fk" x="378" y="390">FK plan_estudio_id</text>
    <text class="field" x="378" y="410">expediente, carnet, nombres</text>
  </g>

  <g id="decanos">
    <rect class="table catalog" x="70" y="1130" width="230" height="95" />
    <text class="table-name" x="88" y="1157">decanos</text>
    <text class="pk" x="88" y="1180">PK id</text>
    <text class="fk" x="88" y="1200">FK facultad_id</text>
  </g>

  <g id="secretarios">
    <rect class="table catalog" x="360" y="1130" width="245" height="95" />
    <text class="table-name" x="378" y="1157">secretarios</text>
    <text class="pk" x="378" y="1180">PK id</text>
    <text class="fk" x="378" y="1200">FK facultad_id</text>
  </g>

  <!-- Seguridad -->
  <g id="usuarios">
    <rect class="table security" x="650" y="150" width="250" height="125" />
    <text class="table-name" x="668" y="177">usuarios</text>
    <text class="pk" x="668" y="200">PK id</text>
    <text class="fk" x="668" y="220">FK estudiante_id</text>
    <text class="field" x="668" y="240">username, email, rol</text>
    <text class="field" x="668" y="260">estado, ultimo_login</text>
  </g>

  <g id="auditoria">
    <rect class="table security" x="965" y="150" width="260" height="120" />
    <text class="table-name" x="983" y="177">auditoria_eventos</text>
    <text class="pk" x="983" y="200">PK id</text>
    <text class="fk" x="983" y="220">FK usuario_id</text>
    <text class="field" x="983" y="240">accion, entidad, ruta, ip</text>
  </g>

  <!-- Documentos -->
  <g id="penalidades">
    <rect class="table document" x="70" y="480" width="260" height="135" />
    <text class="table-name" x="88" y="507">penalidades</text>
    <text class="pk" x="88" y="530">PK id</text>
    <text class="fk" x="88" y="550">FK estudiante_id, carrera_id</text>
    <text class="fk" x="88" y="570">FK usuario_id</text>
    <text class="field" x="88" y="590">correlativo, fecha, ciclo</text>
  </g>

  <g id="retiros">
    <rect class="table document" x="380" y="480" width="270" height="135" />
    <text class="table-name" x="398" y="507">retiros_ciclo</text>
    <text class="pk" x="398" y="530">PK id</text>
    <text class="fk" x="398" y="550">FK estudiante_id, carrera_id</text>
    <text class="fk" x="398" y="570">FK usuario_id</text>
    <text class="field" x="398" y="590">correlativo, fecha, ciclo</text>
  </g>

  <g id="equivalencias">
    <rect class="table document" x="700" y="480" width="270" height="135" />
    <text class="table-name" x="718" y="507">equivalencias</text>
    <text class="pk" x="718" y="530">PK id</text>
    <text class="fk" x="718" y="550">FK estudiante_id</text>
    <text class="fk" x="718" y="570">FK usuario_id</text>
    <text class="field" x="718" y="590">correlativo, solicitud</text>
  </g>

  <g id="absorciones">
    <rect class="table document" x="70" y="680" width="260" height="140" />
    <text class="table-name" x="88" y="707">absorciones</text>
    <text class="pk" x="88" y="730">PK id</text>
    <text class="fk" x="88" y="750">FK estudiante_id</text>
    <text class="fk" x="88" y="770">FK facultad_id, usuario_id</text>
    <text class="field" x="88" y="790">correlativo, ciclo, fecha</text>
  </g>

  <g id="consultas">
    <rect class="table document" x="380" y="680" width="270" height="140" />
    <text class="table-name" x="398" y="707">consultas_estudiantes</text>
    <text class="pk" x="398" y="730">PK id</text>
    <text class="fk" x="398" y="750">FK usuario_id, estudiante_id</text>
    <text class="fk" x="398" y="770">FK carrera_id</text>
    <text class="field" x="398" y="790">tipo, materia, consulta</text>
  </g>

  <g id="anotaciones">
    <rect class="table document" x="700" y="680" width="270" height="140" />
    <text class="table-name" x="718" y="707">anotaciones</text>
    <text class="pk" x="718" y="730">PK id</text>
    <text class="fk" x="718" y="750">FK usuario_id</text>
    <text class="field" x="718" y="770">observador, docente</text>
    <text class="field" x="718" y="790">asignatura, facultad, ciclo</text>
  </g>

  <g id="catalogos">
    <rect class="table catalog" x="700" y="860" width="270" height="95" />
    <text class="table-name" x="718" y="887">anotaciones_catalogos</text>
    <text class="pk" x="718" y="910">PK id</text>
    <text class="field" x="718" y="930">tipo, valor, estado</text>
  </g>

