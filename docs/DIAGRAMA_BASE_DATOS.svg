  <g id="retiro_asignaturas">
    <rect class="table detail" x="1430" y="480" width="300" height="115" />
    <text class="table-name" x="1448" y="507">retiro_ciclo_asignaturas</text>
    <text class="pk" x="1448" y="530">PK id</text>
    <text class="fk" x="1448" y="550">FK retiro_ciclo_id</text>
