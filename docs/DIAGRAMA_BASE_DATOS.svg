  <g id="equivalencia_detalles">
    <rect class="table detail" x="1060" y="640" width="300" height="125" />
    <text class="table-name" x="1078" y="667">equivalencia_detalles</text>
    <text class="pk" x="1078" y="690">PK id</text>
    <text class="fk" x="1078" y="710">FK equivalencia_id</text>
    <text class="field" x="1078" y="730">asignatura cursada/solicitada</text>
    <text class="field" x="1078" y="750">uv, nota, resultado</text>
  </g>

  <g id="absorcion_absorbidas">
    <rect class="table detail" x="1430" y="640" width="300" height="115" />
    <text class="table-name" x="1448" y="667">absorcion_asignaturas_absorbidas</text>
    <text class="pk" x="1448" y="690">PK id</text>
    <text class="fk" x="1448" y="710">FK absorcion_id</text>
    <text class="field" x="1448" y="730">cursada, absorbida, nota</text>
  </g>

  <g id="absorcion_no_existentes">
    <rect class="table detail" x="1060" y="810" width="300" height="115" />
    <text class="table-name" x="1078" y="837">absorcion_asignaturas_no_existentes</text>
    <text class="pk" x="1078" y="860">PK id</text>
    <text class="fk" x="1078" y="880">FK absorcion_id</text>
    <text class="field" x="1078" y="900">asignatura, nota</text>
  </g>

  <g id="absorcion_reprobadas">
    <rect class="table detail" x="1430" y="810" width="300" height="115" />
    <text class="table-name" x="1448" y="837">absorcion_asignaturas_reprobadas</text>
    <text class="pk" x="1448" y="860">PK id</text>
    <text class="fk" x="1448" y="880">FK absorcion_id</text>
    <text class="field" x="1448" y="900">asignatura, nota</text>
  </g>

  <!-- Reportes -->
  <g id="informe">
    <rect class="table report" x="650" y="1040" width="360" height="135" />
    <text class="table-name" x="668" y="1067">informe_documentos_resumen</text>
    <text class="pk" x="668" y="1090">PK id</text>
    <text class="field" x="668" y="1110">source_table, source_id</text>
    <text class="field" x="668" y="1130">tipo_documento, correlativo</text>
    <text class="field" x="668" y="1150">fecha, estado, alumno, carrera</text>
  </g>

  <!-- Relaciones base -->
  <path class="line" d="M300 202 C325 202 335 202 360 202" />
  <text class="label" x="318" y="192">1:N</text>

