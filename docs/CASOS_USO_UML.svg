<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .boundary { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 18; ry: 18; }
      .boundary-title { font: 700 18px Arial, sans-serif; fill: #334155; }
      .actor-name { font: 700 14px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .usecase { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.6; }
      .usecase-alt { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
      .usecase-report { fill: #fef3c7; stroke: #ca8a04; stroke-width: 1.6; }
      .usecase-admin { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.6; }
      .uc-text { font: 700 13px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; }
      .include { stroke: #7c3aed; stroke-width: 1.6; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .note { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 700 11px Arial, sans-serif; fill: #7c3aed; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1220"/>
  <text class="title" x="60" y="58">Diagrama UML de casos de uso</text>
  <text class="subtitle" x="60" y="88">Sistema Académico USO - actores, módulos y funciones principales.</text>

  <rect class="boundary" x="360" y="130" width="1060" height="980"/>
  <text class="boundary-title" x="390" y="165">Sistema Académico USO</text>

  <!-- Actors -->
  <g id="actor-admin" transform="translate(130 200)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="22" x2="0" y2="82" stroke="#0f172a" stroke-width="2"/>
    <line x1="-40" y1="45" x2="40" y2="45" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="82" x2="-34" y2="128" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="82" x2="34" y2="128" stroke="#0f172a" stroke-width="2"/>
    <text class="actor-name" x="0" y="158">Administrador</text>
  </g>

